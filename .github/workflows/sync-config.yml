name: 自动同步播放源

on:
  schedule:
    # 每天北京时间早上 8 点自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你在网页上随时手动点按钮运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取当前仓库
        uses: actions/checkout@v4

      - name: 下载最新 LunaTV-config
        run: |
          curl -fsSL "https://raw.githubusercontent.com/hafrey1/LunaTV-config/main/LunaTV-config.json" -o config.json

      - name: 有更新则自动提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --staged --quiet || (git commit -m "chore: 自动更新播放源" && git push)
